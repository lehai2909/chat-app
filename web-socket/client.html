<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Socket.IO Client</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 1rem; }
        #status { margin-bottom: .5rem; }
        #messages { border: 1px solid #ddd; padding: .5rem; height: 200px; overflow:auto; margin-bottom:.5rem; }
        input[type="text"] { width: calc(100% - 90px); padding: .4rem; }
        button { padding: .4rem .6rem; }
    </style>
</head>
<body>
    <h1>Socket.IO Client</h1>
    <div id="status">Status: <span id="conn">disconnected</span></div>

    <div id="messages" aria-live="polite"></div>

    <div>
        <input id="msg" type="text" placeholder="Type a message..." />
        <button id="send">Send</button>
    </div>

    <!-- Socket.IO client (served by your server at /socket.io/socket.io.js or use CDN) -->
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js" integrity="sha384-mkQ3/7FUtcGyoppY6bz/PORYoGqOl7/aSUMn2ymDOJcapfS6PHqxhRTMh1RR0Q6+" crossorigin="anonymous"></script>
    <script>
        // Connect to the Socket.IO server at the same origin:
        // const socket = io();
        // Or specify server URL and options, e.g.:
        const socket = io("ws://localhost:3000", { transports: ["websocket"] });
        // const socket = io();

        const statusEl = document.getElementById('conn');
        const messagesEl = document.getElementById('messages');
        const input = document.getElementById('msg');
        const sendBtn = document.getElementById('send');

        function append(msg) {
            const el = document.createElement('div');
            el.textContent = msg;
            messagesEl.appendChild(el);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        socket.on('connect', () => {
            statusEl.textContent = 'connected (' + socket.id + ')';
            append('Connected to server. id=' + socket.id);
        });

        socket.on('disconnect', (reason) => {
            statusEl.textContent = 'disconnected';
            append('Disconnected: ' + reason);
        });

        socket.on('connect_error', (err) => {
            statusEl.textContent = 'error';
            append('Connect error: ' + err.message);
        });

        // Example: handle a "message" event from server
        socket.on('message', (data) => {
            append('Server: ' + JSON.stringify(data));
        });

        socket.on("message", (arg) => {
            console.log(arg); // world
            });

        // Send a message to server when button clicked
        sendBtn.addEventListener('click', () => {
            const text = input.value.trim();
            if (!text) return;
            // emit a custom event 'chat message' (server should listen for this)
            socket.emit('chat message', text);
            append('You: ' + text);
            input.value = '';
            input.focus();
        });

        // Send on Enter
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendBtn.click();
        });
    </script>
</body>
</html>
